<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Habit Tracker</h1>
    <form id="add-form">
      <input id="name" placeholder="New habit, for example Read 20 pages" aria-label="Habit name" required>
      <button type="submit">Add</button>
    </form>
    <ul id="habits"></ul>
  </main>
  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
